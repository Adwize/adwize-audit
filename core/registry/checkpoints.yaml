  description: Each custom dim/metric used in a report; watch 50 event / 25 user limits.
  how_to_check: Admin > Custom definitions. Cross-check usage; prune unused.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: customDimensions.list, customMetrics.list'
  severity: medium
- id: ga4.custom_definition_scope_correct

  collector: ga4_data
  api_ref: 'Admin API: (events via Data API runReport dimension eventName)'
  severity: medium
- id: ga4.enhanced_measurement_reviewed
  category: Data Collection
  tool: GA4
  description: Each sub-option (scroll, outbound, site search, video, file, forms) intentional & not duplicating
    custom events.
  how_to_check: Admin > Data Streams > [web] > Enhanced measurement (gear).
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: dataStreams.webStreamData.enhancedMeasurementSettings'
  severity: medium
- id: ga4.naming_convention_consistent
  category: Data Collection
  tool: GA4
  description: snake_case, documented taxonomy, no ad-hoc duplicates (purchase vs Purchase).
  how_to_check: Admin > Events list; Data API eventName scan for casing/variants.
  source: api
  automation: auto
  collector: ga4_data
  api_ref: 'Data API: runReport (eventName)'
  severity: medium
- id: ga4.recommended_event_names_used
  category: Data Collection
  tool: GA4
  description: Using Google's reserved/recommended names unlocks reports (ecommerce, login, sign_up).
  how_to_check: Compare event list to Google recommended events spec.
  source: api
  automation: auto
  collector: ga4_data
  api_ref: 'Data API: runReport (eventName) vs reference list'
  severity: medium
- id: ga4.no_pii_in_events
  category: Data Collection
  tool: GA4
  description: No email/phone/name in event names, params, or user properties.
  how_to_check: DebugView raw params; BigQuery scan of event_params.
  source: ui
  automation: semi
  collector: bigquery
  api_ref: 'BigQuery: regex scan event_params.value'
  severity: medium
- id: ga4.no_duplicate_events
  category: Data Collection
  tool: GA4
  description: e.g. enhanced page_view + manual page_view both firing.
  how_to_check: DebugView; compare event counts vs expected.
  source: api
  automation: auto
  collector: ga4_data
  api_ref: 'Data API: runReport; DebugView'
  severity: medium
- id: ga4.key_events_defined_firing
  category: Configuration
  tool: GA4
  description: Conversions marked and validated live in DebugView/Realtime.
  how_to_check: Admin > Events > toggle 'Mark as key event'; verify in Realtime.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: keyEvents.list'
  severity: medium
- id: ga4.key_event_counting_method_correct
  category: Configuration
  tool: GA4
  description: '''Once per event'' vs ''once per session'' set appropriately per conversion.'
  how_to_check: Admin > Key events > [event] counting method.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: keyEvents.get (countingMethod)'
  severity: medium
- id: ga4.ecommerce_funnel_complete
  category: Data Collection
  tool: GA4
  description: view_item > add_to_cart > begin_checkout > purchase implemented with items[] schema.
  how_to_check: DebugView on a test purchase path; check items array fields.
  source: api
  automation: auto
  collector: ga4_data
  api_ref: Data API runReport; BigQuery items unnest
  severity: medium
- id: ga4.transaction_ids_unique
  category: Data Collection
  tool: GA4
  description: Duplicate transaction_id inflates revenue/purchases.
  how_to_check: 'BigQuery: count distinct transaction_id vs purchase events.'
  source: ui
  automation: semi
  collector: bigquery
  api_ref: 'BigQuery: GROUP BY transaction_id HAVING COUNT>1'
  severity: medium
- id: ga4.revenue_reconciles_to_source
  category: Reporting
  tool: GA4
  description: GA4 purchase revenue matches backend within tolerance.
  how_to_check: Pull date-range revenue, compare to platform/back-office.
  source: api
  automation: auto
  collector: ga4_data
  api_ref: Data API runReport (purchaseRevenue) vs source system
  severity: medium
- id: ga4.custom_definitions_inventory_limits
  category: Configuration

checkpoints:
- id: ga4.data_retention_set_to_14_months
  category: Configuration
  tool: GA4
  description: Event & user data retention should be max (14mo), not the 2mo default, or historical exploration
    data is lost.
  how_to_check: Admin > Data Settings > Data Retention. Confirm 'Event data retention' = 14 months.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: properties.dataRetentionSettings.get'
  severity: medium
- id: ga4.reset_on_new_activity_intentional
  category: Configuration
  tool: GA4
  description: '''Reset user data on new activity'' extends the retention window per active user; decision
    should be deliberate.'
  how_to_check: Admin > Data Settings > Data Retention. Check toggle state vs documented intent.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: properties.dataRetentionSettings.resetUserDataOnNewActivity'
  severity: medium
- id: ga4.timezone_correct
  category: Configuration
  tool: GA4
  description: Reporting timezone must match business region; changing it is not retroactive and creates
    a seam in data.
  how_to_check: Admin > Property Settings > Reporting time zone.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: properties.get (timeZone)'
  severity: medium
- id: ga4.currency_correct
  category: Configuration
  tool: GA4
  description: Revenue is reported in the property currency; wrong currency mis-states all monetary metrics.
  how_to_check: Admin > Property Settings > Currency displayed as.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: properties.get (currencyCode)'
  severity: medium
- id: ga4.industry_category_set
  category: Configuration
  tool: GA4
  description: Enables benchmarking and some modeled features.
  how_to_check: Admin > Property Settings > Industry category.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: properties.get (industryCategory)'
  severity: medium
- id: ga4.property_architecture_justified
  category: Configuration
  tool: GA4
  description: One property per business unit; data streams per platform, not per subdomain. Avoids fragmentation/over-splitting.
  how_to_check: Admin > Account/Property tree. Map structure against business reality.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: properties.list, dataStreams.list'
  severity: medium
- id: ga4.reporting_identity_deliberate
  category: Configuration
  tool: GA4
  description: Blended / Observed / Device-based affects user counts and cross-device; choice should be
    documented.
  how_to_check: Admin > Reporting Identity. Confirm selected mode matches intent.
  source: ui
  automation: manual
  collector: ga4_admin
  api_ref: Not exposed via API (UI-only); document manually
  severity: medium
- id: ga4.google_signals_state_intentional
  category: Configuration
  tool: GA4
  description: On enables cross-device + demographics but triggers thresholding and consent obligations.
  how_to_check: Admin > Data Collection > Google signals. Check on/off vs privacy stance.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: properties.googleSignalsSettings.get'
  severity: medium
- id: ga4.data_redaction_enabled
  category: Configuration
  tool: GA4
  description: Email & URL query redaction strips inadvertently collected PII before storage.
  how_to_check: Admin > Data Streams > [stream] > Redact data. Confirm email + query params on.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: dataStreams (UI toggle; verify in stream settings)'
  severity: medium
- id: ga4.user_access_least_privilege
  category: Configuration
  tool: GA4
  description: No orphaned admins, ex-staff removed, service accounts documented.
  how_to_check: Admin > Account/Property Access Management. Review roles.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: accessBindings.list'
  severity: medium
- id: ga4.bigquery_export_linked
  category: Integrations
  tool: GA4
  description: Is a BigQuery link present at all? No link = no raw event-level data, no unsampled/advanced
    analysis. Major missed opportunity.
  how_to_check: Admin > Product Links > BigQuery. If empty, FAIL.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: bigQueryLinks.list (empty = not linked)'
  severity: medium
- id: ga4.bigquery_daily_streaming_intentional
  category: Integrations
  tool: GA4
  description: If linked, confirm export type (daily, plus streaming for intraday) matches need.
  how_to_check: Admin > BigQuery link > Daily / Streaming toggles.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: bigQueryLinks.get (dailyExportEnabled, streamingExportEnabled)'
  severity: medium
- id: ga4.google_ads_linked
  category: Integrations
  tool: GA4
  description: Is an Ads link present? No link = no auto-tagging join, no GA4 audiences in Ads, no conversion
    import, weaker smart bidding. Major missed opportunity.
  how_to_check: Admin > Product Links > Google Ads. If empty, FAIL.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: googleAdsLinks.list (empty = not linked)'
  severity: medium
- id: ga4.ads_auto_tagging_personalization_on
  category: Integrations
  tool: GA4
  description: If linked, confirm auto-tagging and ad personalization enabled.
  how_to_check: Admin > Google Ads link settings; Ads > auto-tagging.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: googleAdsLinks.get (adsPersonalizationEnabled); Google Ads API auto_tagging'
  severity: medium
- id: ga4.search_console_linked
  category: Integrations
  tool: GA4
  description: Is SC linked? No link = no organic query/landing-page data in GA4. Missed SEO attribution.
  how_to_check: Admin > Product Links > Search Console. If empty, FAIL.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: searchConsoleLinks.list (empty = not linked)'
  severity: medium
- id: ga4.merchant_center_linked_if_ecommerce
  category: Integrations
  tool: GA4
  description: 'For ecommerce/retail: MC link joins product + shopping data. N-A if not ecommerce.'
  how_to_check: Admin > Product Links > Merchant Center.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: (Merchant Center link via UI; verify presence)'
  severity: medium
- id: ga4.other_gmp_links_reviewed
  category: Integrations
  tool: GA4
  description: DV360 / SA360 links present where the media stack uses them.
  how_to_check: Admin > Product Links (each). Confirm vs known stack.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: displayVideo360AdvertiserLinks.list, searchAds360Links.list'
  severity: medium
- id: ga4.no_orphaned_stale_links
  category: Integrations
  tool: GA4
  description: Links to dead Ads accounts or unused BQ projects removed.
  how_to_check: Admin > Product Links; cross-check each target still active.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: *Links.list vs target account status'
  severity: medium
- id: gtm.ga4_config_fires_once_per_page
  category: Data Collection
  tool: GTM
  description: Double-firing config/page_view inflates sessions & page_views.
  how_to_check: GTM Preview / Tag Assistant; or GA4 DebugView watch for duplicate page_view.
  source: api
  automation: auto
  collector: gtm
  api_ref: 'Tag Assistant; GTM API: accounts.containers.versions (tag audit)'
  severity: medium
- id: gtm.single_consistent_measurement_id
  category: Data Collection
  tool: GTM
  description: One G- ID across all containers/pages; mixed IDs split data.
  how_to_check: Inspect GA4 Config tag(s) / gtag snippet. grep page source for G- IDs.
  source: api
  automation: auto
  collector: gtm
  api_ref: 'GTM API: tags.list (filter googtag/gaawc); crawl source'
  severity: medium
- id: gtm.config_precedes_event_tags
  category: Data Collection
  tool: GTM
  description: Config/init must fire before event tags or events drop params.
  how_to_check: GTM tag firing priority + Preview order.
  source: api
  automation: auto
  collector: gtm
  api_ref: 'GTM API: tags.list (firingTriggerId, priority)'
  severity: medium
- id: gtm.datalayer_schema_consistent
  category: Data Collection
  tool: GTM
  description: DataLayer pushed before tags, consistent key naming, no PII.
  how_to_check: GTM Preview > Data Layer tab across key pages.
  source: crawl
  automation: auto
  collector: crawl
  api_ref: Manual / GTM Preview; crawl dataLayer pushes
  severity: medium
- id: gtm.container_published_no_stray_gtag
  category: Data Collection
  tool: GTM
  description: Published version live; no hardcoded gtag alongside GTM causing double hits.
  how_to_check: GTM Versions (published); view-source for rogue gtag.js.
  source: api
  automation: auto
  collector: gtm
  api_ref: 'GTM API: containers.versions.list (live=true); source crawl'
  severity: medium
- id: gtm_ss.server_container_claims_requests
  category: Data Collection
  tool: GTM SS
  description: SS Client correctly claims incoming GA4 requests from web.
  how_to_check: GTM SS Preview; confirm GA4 client claims the request.
  source: api
  automation: auto
  collector: gcp_infra
  api_ref: GTM API (server container); Cloud Run logs
  severity: medium
- id: gtm_ss.first_party_transport_url_set
  category: Data Collection
  tool: GTM SS
  description: Custom first-party endpoint configured (not default GA collect), preserving cookies.
  how_to_check: 'Network tab: GA hits go to your domain; GTM web config transport_url.'
  source: api
  automation: auto
  collector: gcp_infra
  api_ref: Inspect network requests; GTM API config tag fields
  severity: medium
- id: gtm_ss.consent_passed_to_server
  category: Data Collection
  tool: GTM SS
  description: Consent state forwarded to SS container so downstream tags respect it.
  how_to_check: GTM SS Preview > event consent params; check x-ga-gcs.
  source: ui
  automation: semi
  collector: gcp_infra
  api_ref: Cloud Run logs; GTM SS Preview
  severity: medium
- id: gtm_ss.server_container_healthy
  category: Data Collection
  tool: GTM SS
  description: Cloud Run/App Engine instance up, no error spikes, autoscaling sane.
  how_to_check: GCP Console > Cloud Run > revisions metrics/logs.
  source: api
  automation: auto
  collector: gcp_infra
  api_ref: Cloud Monitoring API; Cloud Logging API
  severity: medium
- id: ga4.first_party_cookies_set_fpid
  category: Data Collection
  tool: GA4
  description: Server-set FPID extends cookie lifetime vs JS-set _ga.
  how_to_check: Application > Cookies; confirm FPID present if intended.
  source: crawl
  automation: auto
  collector: crawl
  api_ref: Network/cookie inspection
  severity: medium
- id: ga4.event_inventory_complete
  category: Data Collection
  tool: GA4

  tool: GA4
  description: Event / user / item scope matches intent; high-cardinality flagged.
  how_to_check: Admin > Custom definitions scope column.
  source: api
  automation: auto
  collector: ga4_admin
  api_ref: 'Admin API: customDimensions.list (scope)'
  severity: medium
- id: ga4.other_row_investigated
  category: Data Quality
  tool: GA4
  description: High-cardinality pushes rows into (other); signals dimension design issue.
  how_to_check: Reports/Explore showing '(other)'. Identify offending dimension.
  source: api
  automation: auto
  collector: ga4_data
  api_ref: 'Data API: runReport; check cardinality'
  severity: medium
- id: ga4.not_set_audited
  category: Data Quality
  tool: GA4
  description: Identify which dimensions show (not set) and why (tagging gaps).
  how_to_check: Explore by dimension; isolate (not set) volume.
  source: api
  automation: auto
  collector: ga4_data
  api_ref: 'Data API: runReport filter dimension=''(not set)'''
  severity: medium
- id: ga4.direct_unassigned_anomalies
  category: Data Quality
  tool: GA4
  description: Excess direct = broken tagging, stripped UTMs, redirect loss.
  how_to_check: Reports > Acquisition; check Direct & Unassigned share.
  source: api
  automation: auto
  collector: ga4_data
  api_ref: 'Data API: runReport (sessionDefaultChannelGroup)'
  severity: medium
- id: gtm.bot_internal_traffic_excluded
  category: Data Quality

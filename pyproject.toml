[project]
name = "adwize-audit-core"
version = "0.1.0"
description = "Open-source GA4/GTM measurement auditing — public-source scanning, deterministic checks, scored reports."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.1",
    "pyyaml>=6.0.2",
    "playwright>=1.49.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.0",
    "openai>=1.60.0",
]

[project.urls]
Repository = "https://github.com/Adwize/adwize-audit"
Issues = "https://github.com/Adwize/adwize-audit/issues"

[project.optional-dependencies]
llm = [
    # analysis agent deps now ship in base; kept as an alias for older docs
    "openai>=1.60.0",
]
postgres = [
    "asyncpg>=0.30.0",
    "greenlet>=3.1.1",
]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.0",
]

[project.scripts]
adwize-audit = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "storage", "cli", "agents", "report"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
